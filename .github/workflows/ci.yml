# Continuous Integration - runs on every push and pull request.
#
# Catches broken code before it reaches the server. Needs no secrets and
# touches no infrastructure, so it is safe to run on pull requests from
# anyone.
#
# The backend job spins up a throwaway Postgres container, which is what
# test/backend/test_voice_enrollment.py needs - locally those tests talk
# to the shared dev database (see test/backend/conftest.py), so running
# them here against a disposable instance is strictly better.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sinhaspeech_test
          POSTGRES_USER: sinhaspeech_test
          POSTGRES_PASSWORD: test_password_not_a_secret
        ports:
          - 5432:5432
        # Jobs start before the container is ready to accept connections,
        # so wait for the health check rather than racing it.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: sinhaspeech_test
      POSTGRES_USER: sinhaspeech_test
      POSTGRES_PASSWORD: test_password_not_a_secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # Required by Settings (no default). A throwaway value - this database
      # is destroyed when the job ends and is never reachable externally.
      JWT_SECRET_KEY: ci_only_not_a_real_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # The CPU wheel index matches backend/Dockerfile - the CUDA build of
        # torch is ~2GB and would be dead weight here.
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r backend/requirements.txt

      - name: Create database schema
        # The enrollment tests insert real rows, so the tables must exist.
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Proves the build compiles. The API URL is a placeholder because the
        # real one is baked in at build time by whoever deploys - deployment is
        # manual (`npx vercel --prod` from frontend/), so nothing here ships.
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_USE_MOCK_API: 'false'
        run: npm run build

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinhala-asr"
version = "0.1.0"
description = "Reproducible Sinhala ASR data, training, and evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
  "jiwer>=3.0,<5",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "pyarrow>=15,<20",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
review = ["streamlit>=1.40,<2"]

[project.scripts]
sinhala-asr-prepare = "sinhala_asr.data.audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

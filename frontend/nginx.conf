server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real
    # static file falls back to index.html so the app's own router
    # handles it, instead of nginx 404ing on a refresh at e.g. /settings.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current build's hashed asset filenames, so
    # it must always be revalidated - if a browser caches it, a redeploy
    # can silently keep serving old JS/CSS until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed filenames (index-<hash>.js/css) change on every build, so it's
    # safe for these to be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
